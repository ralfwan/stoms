[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "stoms"
version = "0.11.0"
description = "Browser viewer for atomistic structures and phonons, and an immutable, provenance-first ledger for ASE structures and evaluations"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Ralf Wanzenboeck", email = "ralf.wanzenboeck@tuwien.ac.at" }]
dependencies = [
    "ase>=3.24,<4",
    "numpy>=1.26,<3",
]

[project.urls]
Homepage = "https://github.com/ralfwan/stoms"
Repository = "https://github.com/ralfwan/stoms"
Documentation = "https://ralfwan.github.io/stoms/"

[project.scripts]
stoms = "stoms.cli:main"

[project.optional-dependencies]
postgres = [
    "psycopg[binary]>=3.2",
]
vasp = [
    "pymatgen>=2025.1",
]
phonopy = [
    "phonopy>=4.7,<5",
    "pyyaml>=5.3",
    "seekpath>=2.1",
]
# For environments held at phonopy 4.0-4.6. Those releases need phonors<0.5
# (phonors 0.5 removed grid_index_from_address, used by their mesh/DOS) but
# do not cap it themselves.
phonopy-legacy = [
    "phonopy>=4.0,<4.7",
    "phonors<0.5",
    "pyyaml>=5.3",
    "seekpath>=2.1",
]
jupyter = [
    "anywidget>=0.9",
    "traitlets>=5",
]
# Space group, Wyckoff positions and equivalent sites in the viewers and
# stoms.analysis.symmetry().
symmetry = [
    "spglib>=2.5,<3",
]

[dependency-groups]
browser = [
    "playwright>=1.48",
]
dev = [
    "ipykernel>=7.3.0",
    "pymatgen>=2025.1",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pre-commit>=4.6.0",
    "ruff>=0.9",
    "mypy>=1.13",
    "phonopy>=4.7,<5",
    "pyyaml>=5.3",
    "seekpath>=2.1",
    "spglib>=2.5,<3",
    "anywidget>=0.9",
    "traitlets>=5",
    "jupyterlab>=4.6.5",
]
docs = [
    "mkdocs>=1.6",
]

[tool.uv]
# phonopy-legacy pins phonopy<4.7; the phonopy extra and the dev group need
# phonopy>=4.7.
conflicts = [
    [{ extra = "phonopy" }, { extra = "phonopy-legacy" }],
    [{ extra = "phonopy-legacy" }, { group = "dev" }],
]

[tool.hatch.build.targets.wheel]
packages = ["src/stoms"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 79
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["stoms"]

[tool.mypy]
python_version = "3.11"
strict = false
exclude = [
    "\\.venv/",
    "build/",
    "src/stoms/atomsledger/backends/(hdf5|postgres)\\.py$",
]
packages = ["stoms.atomsledger"]

[[tool.mypy.overrides]]
module = "h5py"
ignore_missing_imports = true
